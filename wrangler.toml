# Core (server). See README.md for the deploy guide.
name = "keepessence-core"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Custom domain. Self-hosters: put your own host here (the zone must be on your account).
routes = [{ pattern = "keepessence.app", custom_domain = true }]
workers_dev = false
preview_urls = false

[triggers]
# Every minute: page fetch fallback, triage, built-in assistants, notifications.
# Every hour: expiry, cleanup.
crons = ["* * * * *", "0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "keepessence-core"
# Self-hosters: replace with the id printed by `wrangler d1 create keepessence-core`.
database_id = "d567ff90-3adc-4b77-997b-c3b27d70f3ee"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
# Self-hosters: replace with the bucket you created (`wrangler r2 bucket create <name>`).
bucket_name = "keepessence-assets"

# Optional: the web app Worker. Requests that are not API, OAuth, MCP, admin or calendar-image
# paths are forwarded to it. Without this binding those requests answer 404.
[[services]]
binding = "WEB"
service = "keepessence-web"

# Sign-in codes by email through the platform's own mail sending. The sender's domain must be
# onboarded for sending in the Cloudflare dashboard (Email Service). Self-hosters without it:
# remove this block and set RESEND_API_KEY instead, or leave both out and hand codes out by hand.
[[send_email]]
name = "EMAIL"

[vars]
# Where the web app lives (allow page, approve page). Also the browser origin allowed by CORS.
APP_ORIGIN = "https://keepessence.app"
# Model endpoint in the Anthropic Messages API format; the key is the secret LLM_API_KEY.
LLM_BASE_URL = "https://cliapi.yan.today"
# The model and how hard it thinks, per job. Triage (the dispatch assistant: title, site and opening only) is light;
# analysis and the daily digest (what the owner reads) get the stronger model. Leave a pair out and these are the
# defaults. LLM_MODEL is the one variable of before: one model for every job, used only where a job's own is not set.
LLM_MODEL_TRIAGE = "claude-haiku-5-5"
LLM_EFFORT_TRIAGE = "low"
LLM_MODEL_WORKER = "claude-sonnet-5-5"
LLM_EFFORT_WORKER = "medium"
# The address sign-in codes are sent from.
EMAIL_FROM = "KeepEssence <login@keepessence.app>"
# Set to "1" only for local development over plain http.
ALLOW_HTTP = "0"
# Tunable limits (strings; empty or missing means the default written here).
TRIAGE_BATCH = "5"                # items per dispatch run, per user
TRIAGE_USERS_PER_RUN = "2"
ANALYSIS_BATCH = "3"              # items per worker run, per user
ANALYSIS_BUDGET_MS = "40000"      # every model request for one item's analysis, together
ANALYSIS_USERS_PER_RUN = "1"
ANALYSIS_PER_USER_PER_DAY = "200"
DIGEST_PER_USER_PER_DAY = "1"
BODY_MAX_CHARS = "100000"         # stored page text
SAVE_RATE_PER_MINUTE = "120"      # per device
PUBLIC_RATE_PER_10_MIN = "30"     # per IP hash, per public endpoint
DELETE_COPIES_ON_USER_DELETE = "true"
ARCHIVE_RETENTION_DAYS = ""       # empty: keep archived items

# Secrets (set with `wrangler secret put NAME`; never written to files):
#   LLM_API_KEY        model key. Unset: built-in assistants do nothing; triage defaults still apply.
#   ADMIN_SECRET       bearer value for /admin/*. Unset: /admin/* answers 404.
#   SIGNING_KEY        HMAC key for upload and download addresses (any long random string).
#   VAPID_PRIVATE_KEY  Web Push key pair, from `npm run gen:vapid`.
#   VAPID_PUBLIC_KEY
#   RESEND_API_KEY     optional; with EMAIL_FROM, sign-in codes are emailed.
#   FEEDBACK_GITHUB_TOKEN  optional; with FEEDBACK_GITHUB_REPO ("owner/name", a plain variable), feedback sent
#                      from inside the app is also filed there as an issue. Give it a token that can only create
#                      issues in that one repository. Without it feedback is kept in D1 and read in the portal.
#   EMAIL_FROM         optional; for example "Sign in <login@example.com>".
